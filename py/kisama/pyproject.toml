[project]
name = "kisama"
version = "0.3.7"
description = "kisama agent for python"
readme = "README.md"
authors = [
    { name = "liming", email = "liming2038@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.14.1",
    "croniter>=6.2.3",
    "ecdsa>=0.19.2",
    "eciespy>=0.4.6",
    "fastapi>=0.139.0",
    "noiseprotocol>=0.3.1",
    "psutil>=7.2.2",
    "pycryptodome>=3.23.0",
    "pydantic>=2.13.4",
    "starlette>=1.3.1",
    "uvicorn>=0.49.0",
    "websockets>=16.0",
]

[project.scripts]
kisama = "kisama.agent:cli"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"
