name: Build and Commit Multi-Language Agents

on:
  workflow_run:
    workflows: ["Obfuscate Agent"] # 👈 填写上一个工作流的 name
    types:
      - completed
  workflow_dispatch: # 允许在 GitHub 网页端手动点击运行

# 赋予工作流推送代码到仓库的权限（非常重要）
permissions:
  contents: write

jobs:
  # ==================== Job 1: 编译 Java 17 版本 ====================
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build project
        working-directory: java  
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Commit and push jar
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add java/target/kisama-agent-java-0.1.0-obfuscated.jar
          
          if git diff --staged --quiet; then
            echo "No changes to commit, the jar file is up to date."
          else
            git commit -m "chore: update obfuscated jar [skip ci]"
            git push
          fi

  # ==================== Job 2: 编译 Java 11 版本 ====================
  build-and-update-java11:
    runs-on: ubuntu-latest
    needs: build-and-update # 👈 等待 Java 17 推送完毕

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build project
        working-directory: java11
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Commit and push jar
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add java11/target/kisama-agent-java-0.1.0-obfuscated.jar
          
          if git diff --staged --quiet; then
            echo "No changes to commit, the java11 jar file is up to date."
          else
            git commit -m "chore: update obfuscated java11 jar [skip ci]"
            git push
          fi

  # ==================== Job 3: 🚀 新增：编译 GO 版本组件 ====================
  build-and-update-go:
    runs-on: ubuntu-latest
    needs: build-and-update-java11 # 👈 核心关键：排在 Java 11 后面执行，彻底杜绝 Git 并发冲突

    steps:
      # 1. 克隆包含前面两个任务提交后的最新代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 设置 Go 编译环境
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22' # 👈 可以指定具体版本，或者改为 'stable' 使用最新稳定版
          cache: true        # 自动开启 go 依赖和构建缓存，提速编译

      # 3. 切换到 go 目录并执行构建脚本
      - name: Build Go project
        working-directory: go # 👈 切换到 go 工作目录
        run: |
          chmod +x build.sh
          ./build.sh

      # 4. 提交并推送生成的三个 Go 二进制执行文件
      - name: Commit and push Go binaries
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 👈 一口气追踪三个编译产物文件
          git add go/agent go/agent-darwin-arm64 go/agent-linux-arm64
          
          if git diff --staged --quiet; then
            echo "No changes to commit, Go binaries are up to date."
          else
            # 加上 [skip ci] 避免由于 Actions 自动推送触发反向死循环
            git commit -m "chore: update compiled go binaries [skip ci]"
            git push
          fi