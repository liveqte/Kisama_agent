name: Build and Commit Multi-Language Agents

on:
  workflow_run:
    workflows: ["Obfuscate Agent"] # 👈 填写上一个工作流的 name
    types:
      - completed
  workflow_dispatch: # 允许在 GitHub 网页端手动点击运行

# 赋予工作流推送代码到仓库的权限
permissions:
  contents: write

jobs:
  build-all-and-push:
    runs-on: ubuntu-latest

    steps:
      # ==================== 1. 初始化环境与克隆 ====================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==================== 2. 编译 Java 17 组件 ====================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven' # 开启 Maven 依赖缓存

      - name: Build Java 17 project
        working-directory: java  
        run: |
          chmod +x build.sh
          ./build.sh

      # ==================== 3. 编译 Java 11 组件 ====================
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11' # 👈 切换为 Java 11
          distribution: 'temurin'
          # 注意：因为同一作业里的缓存是共享的，如果项目结构相似，可以继续复用或不设缓存
          cache: 'maven'

      - name: Build Java 11 project
        working-directory: java11 # 👈 切换到 java11 目录
        run: |
          chmod +x build.sh
          ./build.sh

      # ==================== 4. 编译 GO 版本组件 ====================
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true # 开启 Go 依赖缓存

      - name: Build Go project
        working-directory: go # 👈 切换到 go 目录
        run: |
          chmod +x build.sh
          ./build.sh

      # ==================== 5. 🌟 终极收网：所有组件合并为单次 Push ====================
      - name: Commit and push all agents
        run: |
          # 1. 配置 Git 机器人身份
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 2. 一口气将所有编译出来的产物全部加进暂存区
          git add java/target/kisama-agent-java-0.1.0-obfuscated.jar
          git add java11/target/kisama-agent-java-0.1.0-obfuscated.jar
          git add go/agent go/agent-darwin-arm64 go/agent-linux-arm64
          
          # 3. 检查这三个目录下的产物是否有任何实际更新，防止无变化提交报错
          if git diff --staged --quiet; then
            echo "🎉 所有组件均未发生变化，无需提交。"
          else
            # 4. 仅提交一次，并加上 [skip ci] 堵死死循环
            git commit -m "chore: update compiled go binaries and obfuscated jars [skip ci]"
            echo "🚀 正在单次向远程推送所有组件..."
            git push
          fi