name: Obfuscate Agent

on:
  push:
    branches:
      - main
    paths:
      - py/agent.py
      - js/agent.js

  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  obfuscate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Obfuscate py/agent.py
        run: python tools/obfuscator.py

      - name: Obfuscate js/agent.js
        run: >
          npx -y javascript-obfuscator js/agent.js
          --output js/agent_obs.js
          --compact false
          --identifier-names-generator mangled
          --rename-globals true
          --string-array true
          --string-array-encoding 'base64'
          --control-flow-flattening true
          --reserved-strings "ECDSA公钥内容,ECIES公钥内容"

      - name: Commit generated files if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add py/agent_obs.py js/agent_obs.js
          
          # 无论混淆文件是否变化，都允许空提交，确保 release 分支能对齐最新的 main 源码
          git commit -m "Auto-update obfuscated files" --allow-empty
          
          # 💡 核心改动：将当前带有混淆文件的 commit 强推到独立的 release 分支，不污染 main
          git push origin HEAD:release --force
