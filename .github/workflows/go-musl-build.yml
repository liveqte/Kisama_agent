name: Go musl build

on:
  workflow_dispatch:

jobs:
  build-musl-artifacts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      # 引入高度稳定的 Zig 编译器环境
      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: '0.13.0'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf

      - name: Prepare build directory
        working-directory: go
        run: |
          mkdir -p dist
          go mod download

      # ---- linux/amd64 static binary (pure Go, no CGO) ----
      - name: Build linux/amd64 static binary
        working-directory: go
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -trimpath -ldflags='-s -w' -o dist/agent-linux-amd64 .

      # ---- linux/amd64 static shared library (musl, libc embedded via Zig) ----
      - name: Build linux/amd64 static shared library
        working-directory: go
        env:
          CGO_ENABLED: 1
          GOOS: linux
          GOARCH: amd64
          CC: "zig cc -target x86_64-linux-musl"
          CXX: "zig c++ -target x86_64-linux-musl"
        run: |
          go build -trimpath -buildmode=c-shared \
            -ldflags='-s -w -linkmode external -extldflags "-Wl,-Bstatic"' \
            -o dist/libkisama-linux-amd64.so .
          # 抹除 Zig 强行注入的幽灵依赖标签
          patchelf --remove-needed libc.so dist/libkisama-linux-amd64.so

      # ---- linux/arm64 static binary (pure Go, no CGO) ----
      - name: Build linux/arm64 static binary
        working-directory: go
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: arm64
        run: |
          go build -trimpath -ldflags='-s -w' -o dist/agent-linux-arm64 .

      # ---- linux/arm64 static shared library (musl, libc embedded via Zig) ----
      - name: Build linux/arm64 static shared library
        working-directory: go
        env:
          CGO_ENABLED: 1
          GOOS: linux
          GOARCH: arm64
          CC: "zig cc -target aarch64-linux-musl"
          CXX: "zig c++ -target aarch64-linux-musl"
        run: |
          go build -trimpath -buildmode=c-shared \
            -ldflags='-s -w -linkmode external -extldflags "-Wl,-Bstatic"' \
            -o dist/libkisama-linux-arm64.so .
          # 抹除 Zig 强行注入的幽灵依赖标签
          patchelf --remove-needed libc.so dist/libkisama-linux-arm64.so

      # ---- windows/amd64 binary (pure Go, no CGO) ----
      - name: Build windows/amd64 binary
        working-directory: go
        env:
          CGO_ENABLED: 0
          GOOS: windows
          GOARCH: amd64
        run: |
          go build -trimpath -ldflags='-s -w' -o dist/agent-windows-amd64.exe .

      # ---- windows/arm64 binary (pure Go, no CGO) ----
      - name: Build windows/arm64 binary
        working-directory: go
        env:
          CGO_ENABLED: 0
          GOOS: windows
          GOARCH: arm64
        run: |
          go build -trimpath -ldflags='-s -w' -o dist/agent-windows-arm64.exe .

      # ---- Verify artifacts are static (no glibc / no external libc NEEDED) ----
      - name: Verify static linking
        working-directory: go
        run: |
          set -e
          echo "=== Checking agent binaries (should be static, no NEEDED) ==="
          for bin in dist/agent-linux-amd64 dist/agent-linux-arm64; do
            if [ -f "$bin" ]; then
              needed=$(objdump -p "$bin" 2>/dev/null | grep 'NEEDED' || true)
              interp=$(objdump -p "$bin" 2>/dev/null | grep 'INTERP' || true)
              if [ -n "$needed" ] || [ -n "$interp" ]; then
                echo "ERROR: $bin is not fully static"
                echo "  NEEDED: $needed"
                echo "  INTERP: $interp"
                exit 1
              fi
              echo "OK: $bin is fully static"
            fi
          done

          echo ""
          echo "=== Checking shared libraries (should have no libc NEEDED) ==="
          for so in dist/libkisama-linux-amd64.so dist/libkisama-linux-arm64.so; do
            if [ -f "$so" ]; then
              needed=$(objdump -p "$so" 2>/dev/null | grep 'NEEDED' || true)
              if echo "$needed" | grep -qiE 'libc\.|libpthread\.|libdl\.|libm\.'; then
                echo "ERROR: $so still depends on a C library"
                echo "  NEEDED: $needed"
                exit 1
              fi
              echo "OK: $so has no external libc dependency"
              if [ -n "$needed" ]; then
                echo "  (remaining NEEDED: $needed)"
              fi
            fi
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: musl-go-builds
          path: go/dist/*