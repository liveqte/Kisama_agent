name: Go musl build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-musl-artifacts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Install musl toolchain (x86_64)
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools musl-dev

      - name: Install aarch64 musl cross-toolchain
        run: |
          # musl.cc provides the same gcc-based musl toolchain as musl-tools,
          # but for aarch64. This handles -extldflags "-static" correctly for
          # c-shared mode, just like musl-gcc does for x86_64.
          curl -fL --retry 3 --retry-delay 5 \
            https://musl.cc/aarch64-linux-musl-cross.tgz \
            -o /tmp/aarch64-musl.tgz
          sudo tar -xf /tmp/aarch64-musl.tgz -C /opt
          echo "/opt/aarch64-linux-musl-cross/bin" >> "$GITHUB_PATH"

      - name: Verify toolchains
        run: |
          echo "=== x86_64 musl-gcc ==="
          which musl-gcc && musl-gcc --version | head -1
          echo ""
          echo "=== aarch64 musl cross-compiler ==="
          which aarch64-linux-musl-gcc && aarch64-linux-musl-gcc --version | head -1

      - name: Prepare build directory
        working-directory: go
        run: |
          mkdir -p dist
          go mod download

      # ---- linux/amd64 static binary (pure Go, no CGO) ----
      - name: Build linux/amd64 static binary
        working-directory: go
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -trimpath -ldflags='-s -w' -o dist/agent-linux-amd64 .

      # ---- linux/amd64 static shared library (musl, libc embedded) ----
      - name: Build linux/amd64 static shared library
        working-directory: go
        env:
          CGO_ENABLED: 1
          GOOS: linux
          GOARCH: amd64
          CC: musl-gcc
        run: |
          go build -trimpath -buildmode=c-shared \
            -ldflags='-s -w -linkmode external -extldflags "-static"' \
            -o dist/libkisama-linux-amd64.so .

      # ---- linux/arm64 static binary (pure Go, no CGO) ----
      - name: Build linux/arm64 static binary
        working-directory: go
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: arm64
        run: |
          go build -trimpath -ldflags='-s -w' -o dist/agent-linux-arm64 .

      # ---- linux/arm64 static shared library (musl cross, libc embedded) ----
      - name: Build linux/arm64 static shared library
        working-directory: go
        env:
          CGO_ENABLED: 1
          GOOS: linux
          GOARCH: arm64
          CC: aarch64-linux-musl-gcc
        run: |
          go build -trimpath -buildmode=c-shared \
            -ldflags='-s -w -linkmode external -extldflags "-static"' \
            -o dist/libkisama-linux-arm64.so .

      # ---- Verify artifacts are static (no glibc / no external libc NEEDED) ----
      - name: Verify static linking
        working-directory: go
        run: |
          set -e
          echo "=== Checking agent binaries (should be static, no NEEDED) ==="
          for bin in dist/agent-linux-amd64 dist/agent-linux-arm64; do
            if [ -f "$bin" ]; then
              needed=$(objdump -p "$bin" 2>/dev/null | grep 'NEEDED' || true)
              interp=$(objdump -p "$bin" 2>/dev/null | grep 'INTERP' || true)
              if [ -n "$needed" ] || [ -n "$interp" ]; then
                echo "ERROR: $bin is not fully static"
                echo "  NEEDED: $needed"
                echo "  INTERP: $interp"
                exit 1
              fi
              echo "OK: $bin is fully static"
            fi
          done

          echo ""
          echo "=== Checking shared libraries (should have no libc NEEDED) ==="
          for so in dist/libkisama-linux-amd64.so dist/libkisama-linux-arm64.so; do
            if [ -f "$so" ]; then
              needed=$(objdump -p "$so" 2>/dev/null | grep 'NEEDED' || true)
              if echo "$needed" | grep -qiE 'libc\.|libpthread\.|libdl\.|libm\.'; then
                echo "ERROR: $so still depends on a C library"
                echo "  NEEDED: $needed"
                exit 1
              fi
              echo "OK: $so has no external libc dependency"
              if [ -n "$needed" ]; then
                echo "  (remaining NEEDED: $needed)"
              fi
            fi
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: musl-go-builds
          path: go/dist/*
